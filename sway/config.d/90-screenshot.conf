# Autostart Flameshot daemon with Qt scaling fix
exec env QT_AUTO_SCREEN_SCALE_FACTOR=0 QT_SCREEN_SCALE_FACTORS="1;1" flameshot

# Screenshot Shortcuts via Flameshot
# Explicitly unbind default grimshot shortcuts on host
unbindsym Print
unbindsym Alt+Print
unbindsym Ctrl+Print

# Sway window rules for Flameshot overlay GUI (Wayland + XWayland)
for_window [app_id="flameshot"] floating enable, border pixel 0, mouse_warping no
for_window [class="(?i)flameshot"] floating enable, border pixel 0, mouse_warping no

# Bind Flameshot shortcuts
bindsym Print exec env QT_AUTO_SCREEN_SCALE_FACTOR=0 QT_SCREEN_SCALE_FACTORS="1;1" flameshot gui
bindsym $mod+Shift+s exec env QT_AUTO_SCREEN_SCALE_FACTOR=0 QT_SCREEN_SCALE_FACTORS="1;1" flameshot gui
bindsym Shift+Print exec env QT_AUTO_SCREEN_SCALE_FACTOR=0 QT_SCREEN_SCALE_FACTORS="1;1" flameshot full -c
bindsym Ctrl+Print exec env QT_AUTO_SCREEN_SCALE_FACTOR=0 QT_SCREEN_SCALE_FACTORS="1;1" flameshot gui --delay 2000

