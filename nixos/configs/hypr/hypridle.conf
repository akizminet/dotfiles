# Hypridle Configuration
# Managed by ~/dev/dotfiles

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms('on')"
}

# Dim quickly if already locked (e.g. manual SUPER + L lock)
listener {
    timeout = 10
    ignore_inhibit = true
    condition_cmd = pidof hyprlock
    on-timeout = @hyprDim@ dim
    on-resume = @hyprDim@ restore
}

# Turn displays off shortly after locking
listener {
    timeout = 20
    ignore_inhibit = true
    condition_cmd = pidof hyprlock
    on-timeout = hyprctl dispatch "hl.dsp.dpms('off')"
    on-resume = hyprctl dispatch "hl.dsp.dpms('on')"
}

listener {
    timeout = 150
    on-timeout = @hyprDim@ dim
    on-resume = @hyprDim@ restore
}

listener {
    timeout = 300
    on-timeout = pidof hyprlock || hyprlock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch "hl.dsp.dpms('off')"
    on-resume = hyprctl dispatch "hl.dsp.dpms('on')"
}
