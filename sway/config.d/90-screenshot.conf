
# Screenshot Shortcuts via Satty
# Explicitly unbind default grimshot shortcuts on host
unbindsym Print
unbindsym Alt+Print
unbindsym Ctrl+Print

# Sway window rules for Satty annotation GUI
for_window [app_id="(?i)satty"] floating enable
for_window [class="(?i)satty"] floating enable

# Bind Satty screenshot shortcuts
bindsym Print exec screenshot region
bindsym $mod+Shift+s exec screenshot region
bindsym Shift+Print exec screenshot full
bindsym Ctrl+Print exec screenshot delay 2

