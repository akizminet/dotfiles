# NixOS session PATH and XDG environment
PATH=/run/wrappers/bin:${HOME}/.local/bin:/etc/profiles/per-user/${USER}/bin:/run/current-system/sw/bin:${PATH}
XDG_DATA_DIRS=/etc/profiles/per-user/${USER}/share:/run/current-system/sw/share:${HOME}/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:${XDG_DATA_DIRS:-/usr/share}
SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
NIX_SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.crt
NIX_LD=/run/current-system/sw/share/nix-ld/lib/ld.so
NIX_LD_LIBRARY_PATH=/run/current-system/sw/share/nix-ld/lib
