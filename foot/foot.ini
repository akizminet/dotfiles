# ~/.config/foot/foot.ini
# Catppuccin Mocha Foot Configuration

font=MonaspiceNe Nerd Font:style=Medium:size=11, Noto Color Emoji:size=11
font-bold=MonaspiceNe Nerd Font:style=Bold:size=11, Noto Color Emoji:size=11
font-italic=MonaspiceNe Nerd Font:style=Medium Italic:size=11, Noto Color Emoji:size=11
font-bold-italic=MonaspiceNe Nerd Font:style=Bold Italic:size=11, Noto Color Emoji:size=11

pad=12x12 center
selection-target=primary

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.93
foreground=cdd6f4
background=1e1e2e

## Cursor & Selection
cursor=11111b f5e0dc
selection-foreground=cdd6f4
selection-background=414356

## Normal colors
regular0=45475a  # surface1
regular1=f38ba8  # red
regular2=a6e3a1  # green
regular3=f9e2af  # yellow
regular4=89b4fa  # blue
regular5=f5c2e7  # pink
regular6=94e2d5  # teal
regular7=bac2de  # subtext1

## Bright colors
bright0=585b70   # surface2
bright1=f38ba8   # red
bright2=a6e3a1   # green
bright3=f9e2af   # yellow
bright4=89b4fa   # blue
bright5=f5c2e7   # pink
bright6=94e2d5   # teal
bright7=a6adc8   # subtext0

## Dim colors
dim0=45475a
dim1=f38ba8
dim2=a6e3a1
dim3=f9e2af
dim4=89b4fa
dim5=f5c2e7
dim6=94e2d5
dim7=bac2de

## 16 / 17 Color Extensions
16=fab387
17=f5e0dc

## Search & Jump Labels
search-box-no-match=11111b f38ba8
search-box-match=cdd6f4 313244
jump-labels=11111b fab387
urls=89b4fa

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=always
style=single

[scrollback]
lines=10000
multiplier=3.0

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
show-urls-launch=Control+Shift+o
show-urls-copy=Control+Mod1+Shift+o
pipe-selected=[sh -c "xargs -r xdg-open"] Control+Shift+y

[mouse-bindings]
select-begin-block=none
select-extend-character-wise=none
show-urls-launch=Control+BTN_LEFT Control+BTN_RIGHT
