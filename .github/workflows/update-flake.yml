name: Update Flake Lock (Cache-Gated)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 03:23, 09:23, 15:23, 21:23 UTC (10:23, 16:23, 22:23, 04:23 ICT), off :00 to avoid cron contention
    - cron: "23 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: verify-config-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify PR config cache readiness
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          python3 scripts/check-nixos-cache.py

  update:
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.actor != 'github-actions[bot]')
    permissions:
      contents: write
    concurrency:
      group: update-flake
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify committed config cache readiness
        if: github.event_name == 'push'
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          python3 scripts/check-nixos-cache.py

      - name: Update public flake inputs
        id: update-lock
        env:
          GIT_SSH_COMMAND: /bin/false
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          read_revs() {
            python3 -c '
          import json
          with open("flake.lock", "r", encoding="utf-8") as fh:
              nodes = json.load(fh).get("nodes", {})
          for name in ("nixpkgs", "akquick", "fcitx5-lotus"):
              rev = nodes.get(name, {}).get("locked", {}).get("rev", "unknown")[:12]
              print(f"{name}={rev}")
          '
          }

          OLD_REVS="$(read_revs)"
          nix flake update nixpkgs akquick fcitx5-lotus
          NEW_REVS="$(read_revs)"

          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No flake.lock changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            SUMMARY="$(python3 -c '
          import sys
          old = dict(line.split("=", 1) for line in sys.argv[1].splitlines() if "=" in line)
          new = dict(line.split("=", 1) for line in sys.argv[2].splitlines() if "=" in line)
          lines = []
          for k in ("nixpkgs", "akquick", "fcitx5-lotus"):
              old_rev = old.get(k, "?")
              new_rev = new.get(k, "?")
              if old_rev != new_rev:
                  lines.append(f"- {k}: {old_rev} -> {new_rev}")
          print("\n".join(lines) or "- flake.lock updated")
          ' "$OLD_REVS" "$NEW_REVS")"
            {
              echo "summary<<__FLAKE_SUMMARY_EOF__"
              echo "$SUMMARY"
              echo "__FLAKE_SUMMARY_EOF__"
            } >> "$GITHUB_OUTPUT"
            echo "Updated flake.lock:"
            echo "$SUMMARY"
          fi

      - name: Check cache.nixos.org readiness
        id: check-cache
        if: steps.update-lock.outputs.changed == 'true'
        env:
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
        run: |
          set +e
          python3 scripts/check-nixos-cache.py
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "All upstream nixpkgs derivations are cached."
          elif [ "$rc" -eq 2 ]; then
            echo "Upstream cache still building; skipping commit until next scheduled run."
            exit 0
          else
            exit "$rc"
          fi

      - name: Commit and push updated flake.lock
        if: steps.update-lock.outputs.changed == 'true' && steps.check-cache.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit \
            -m "chore(flake.lock): update locked revisions" \
            -m "${{ steps.update-lock.outputs.summary }}"
          git push origin HEAD:main
