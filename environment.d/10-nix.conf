# Nix profile PATH and XDG environment for systemd & GUI session
PATH=${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${HOME}/.local/bin:${PATH}
XDG_DATA_DIRS=${HOME}/.nix-profile/share:/nix/var/nix/profiles/default/share:${HOME}/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:${XDG_DATA_DIRS:-/usr/local/share/:/usr/share/}
