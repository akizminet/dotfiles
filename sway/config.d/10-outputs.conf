# Sway output & wallpaper configuration
# You can list multiple monitors; Sway will only apply settings to connected displays.

# --- Machine 1 / Setup (DELL U2412M Dual Monitor Setup) ---
output "Dell Inc. DELL U2412M WCVNJ94N0SLB" pos 0 0 res 1920x1200
output "Dell Inc. DELL U2412M WCVNJ96F1R7B" pos 1920 0 res 1920x1200

# --- Machine 2 / Setup (LG Dual QHD 2K Setup) ---
output "LG Electronics LG HDR QHD 202NTVSJJ935" pos 0 0 res 2560x1440
output "LG Electronics LG HDR QHD 201NTABFB872" pos 2560 0 res 2560x1440

# --- Other Device / Connector Fallbacks ---
output DP-1 pos 0 0
output HDMI-A-2 pos 2560 0
output HDMI-A-1 pos 0 0
output eDP-1 pos 0 0

# Dynamic Day/Night Wallpaper switcher (executes on startup and reload)
exec_always /var/home/phamnv/.config/sway/scripts/wallpaper-switcher.sh
