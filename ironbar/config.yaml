name: main
anchor_to_edges: true
position: top
height: 34
popup_autohide: true

start:
  - type: workspaces
    all_monitors: false
    sort: name
  - type: focused
    show_icon: false
    truncate:
      mode: end
      max_len: 50

center:
  - type: clock
    name: clock
    format: "🕒 %H:%M:%S"

end:
  - type: tray
  - type: custom
    name: quicksettings
    bar:
      - type: button
        name: quicksettings_btn
        label: "{{poll:1000:akquick -s}}"
        on_click_left: "akquick -t"
        on_click_right: "akquick -p wifi"
  - type: custom
    name: notification
    bar:
      - type: button
        name: notification_btn
        label: "🔔"
        on_click_left: "swaync-client -t -sw"
        on_click_right: "swaync-client -d -sw"
  - type: custom
    name: power
    bar:
      - type: button
        name: power_btn
        label: "⏻"
        on_click_left: "/var/home/phamnv/.config/rofi/powermenu.sh"
