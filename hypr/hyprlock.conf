# Hyprlock Configuration
# Managed by ~/dev/dotfiles

auth {
    pam {
        enabled = true
        module = login
    }
}

general {
    disable_loading_bar = false
    hide_cursor = false
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    color = rgba(24, 24, 37, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = MonaspiceNe Nerd Font, sans-serif
    position = 0, 120
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(166, 173, 200)
    font_size = 20
    font_family = MonaspiceNe Nerd Font, sans-serif
    position = 0, 40
    halign = center
    valign = center
}

# Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(180, 190, 254)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter Password...</span>
    hide_input = false
    rounding = -1
    check_color = rgb(203, 166, 247)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200
    position = 0, -50
    halign = center
    valign = center
}
